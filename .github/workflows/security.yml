name: Security

# Runs on a schedule as well as on changes: a Go release goes out of support and
# new vulnerabilities are published without anything in this repository changing.
# mixlab built on unsupported Go 1.24 for seven months while every push was green.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 06:17 UTC
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go toolchain support and vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fail if go.mod's toolchain is out of support
        run: python3 scripts/check_go_support.py

      # Reachable vulnerabilities only: govulncheck exits non-zero when mixlab
      # calls affected code, under the toolchain go.mod names. The -tags mlx
      # build needs MLX headers and is covered by the release workflow's binary
      # scan.
      - name: govulncheck
        env:
          CGO_ENABLED: "0"
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  workflows:
    name: Workflow lint and security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # Unpinned actions, template injection, credential persistence and token
      # scope. The auditor persona also reports low-confidence findings, so a
      # clean result here means the workflows had nothing left to fix.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.30.1 zizmor --persona=auditor --format=github .github/workflows
