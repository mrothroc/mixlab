name: HF Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cmd/mixlab/**'
      - 'train/**'
      - 'arch/**'
      - 'requirements-hf.txt'
      - 'packaging/mlx-tested-range.txt'
      - '.github/workflows/hf-parity.yml'

# Read-only token: these jobs only check out and test the source.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-hf-parity:
    name: export-hf parity smoke
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HF_PARITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install HF Python dependencies
        run: |
          python -m pip install -r requirements-hf.txt
          python -c "import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__)"

      - name: Install MLX runtime
        run: brew install mlx

      # Pure-Go oracle tests build with the non-MLX stubs, matching main CI.
      # CGO_ENABLED=1 without -tags mlx is unsupported (the gpu package then
      # tries to compile MLX cgo without selecting the MLX sources).
      - name: Run export-hf Go oracle tests
        env:
          CGO_ENABLED: "0"
        run: go test ./cmd/mixlab ./train -run 'TestExportHF|TestRunExportHF|TestHFModeling' -count=1

      # Load-bearing FR-1 check: exports deterministic trained-magnitude fixtures, runs the
      # embedded modeling_mixlab.py through transformers, and asserts agreement
      # with the native MLX forward. HF_PARITY=1 plus the installed torch make
      # TestExportHFNativePythonParity execute (it skips otherwise).
      - name: Run native-vs-HF Python parity (MLX)
        env:
          CGO_ENABLED: "1"
          HF_PARITY_PYTHON: python3
        run: go test -tags mlx ./train -run 'TestExportHFNativePythonParity|TestExportHF.*Parity|TestNativeHF.*Parity' -count=1 -v
