name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: these jobs only check out and test the source.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # ./... is safe without MLX: the gpu package ships CGO_ENABLED=0 stubs.
      # Enumerating packages here drifted -- artifact/ and recruitment/ were
      # added with tests that never ran. Deriving the list cannot drift.
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Install prepare test dependencies
        run: |
          python -m pip install -r requirements-prepare.txt
          python -c "import numpy, tokenizers"

      - name: Test
        run: CGO_ENABLED=0 go test ./... -count=1 -timeout 600s

      # scripts/ ships in the RunPod image; its tests otherwise only ran by hand.
      - name: Test Python scripts
        run: python -m unittest discover -s scripts -p '*_test.py'

      # The Docker Hub overview is published from docker/DOCKERHUB.md by Cloud
      # Build. Validate it here so a blank or oversized file fails on the PR
      # rather than silently blanking the image's landing page on merge.
      - name: Test Docker Hub description sync
        run: python3 docker/test_sync_dockerhub_description.py

      - name: Validate Docker Hub descriptions
        run: |
          python3 docker/sync_dockerhub_description.py --dry-run \
            --target=mixlab=docker/DOCKERHUB.md \
            --target=mixlab-cuda=docker/DOCKERHUB-cuda.md \
            --target=mixlab-cuda-base=docker/DOCKERHUB-cuda-base.md

      # Exercise the pinned dependency's real completion loop without a GPU.
      - name: Test MLX CUDA worker patch
        run: |
          ROOT="$RUNNER_TEMP/mlx-worker"
          SOURCE="$ROOT/mlx/backend/cuda/worker.cpp"
          mkdir -p "$(dirname "$SOURCE")"
          curl --fail --location --max-time 30 \
            https://raw.githubusercontent.com/ml-explore/mlx/7a1d4f5c12ac82f4b4d0a6e71538d89ca0605247/mlx/backend/cuda/worker.cpp \
            -o "$SOURCE"
          python3 docker/test_mlx_worker.py --source "$SOURCE" --expect-spin
          git -C "$ROOT" apply --check "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-worker-wait.patch"
          git -C "$ROOT" apply "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-worker-wait.patch"
          python3 docker/test_mlx_worker.py --source "$SOURCE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        env:
          CGO_ENABLED: "0"
        with:
          version: v2.13.2
          args: ./...

      - name: Check file sizes (max 1000 lines per .go file)
        run: |
          find . -name "*.go" -not -path "./vendor/*" -exec wc -l {} + | sort -rn | \
            awk '$1 > 1000 && $2 != "total" {printf "OVER 1000 LINES: %s (%d)\n", $2, $1; err=1} END {exit err}'
