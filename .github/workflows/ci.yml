name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # GPU package requires MLX headers (Metal/CUDA) — skip on CI.
      # Pure-Go packages (arch, data, train) compile and test without CGO.
      - name: Vet
        run: CGO_ENABLED=0 go vet ./arch/... ./cmd/mixlab ./data/... ./train/...

      - name: Install prepare test dependencies
        run: |
          python -m pip install -r requirements-prepare.txt
          python -c "import numpy, tokenizers"

      - name: Test
        run: CGO_ENABLED=0 go test ./arch/... ./cmd/mixlab ./data/... ./train/... -count=1 -timeout 120s

      # scripts/ ships in the RunPod image; its tests otherwise only ran by hand.
      - name: Test Python scripts
        run: python -m unittest discover -s scripts -p '*_test.py'

      # Exercise the pinned dependency's real completion loop without a GPU.
      - name: Test MLX CUDA worker patch
        run: |
          ROOT="$RUNNER_TEMP/mlx-worker"
          SOURCE="$ROOT/mlx/backend/cuda/worker.cpp"
          mkdir -p "$(dirname "$SOURCE")"
          curl --fail --location --max-time 30 \
            https://raw.githubusercontent.com/ml-explore/mlx/7a1d4f5c12ac82f4b4d0a6e71538d89ca0605247/mlx/backend/cuda/worker.cpp \
            -o "$SOURCE"
          python3 docker/test_mlx_worker.py --source "$SOURCE" --expect-spin
          git -C "$ROOT" apply --check "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-worker-wait.patch"
          git -C "$ROOT" apply "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-worker-wait.patch"
          python3 docker/test_mlx_worker.py --source "$SOURCE"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: golangci/golangci-lint-action@v7
        env:
          CGO_ENABLED: "0"
        with:
          version: v2.1.6
          args: ./arch/... ./cmd/mixlab ./data/... ./train/...

      - name: Check file sizes (max 1000 lines per .go file)
        run: |
          find . -name "*.go" -not -path "./vendor/*" -exec wc -l {} + | sort -rn | \
            awk '$1 > 1000 && $2 != "total" {printf "OVER 1000 LINES: %s (%d)\n", $2, $1; err=1} END {exit err}'
