name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: these jobs only check out and test the source.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # ./... is safe without MLX: the gpu package ships CGO_ENABLED=0 stubs.
      # Enumerating packages here drifted -- artifact/ and recruitment/ were
      # added with tests that never ran. Deriving the list cannot drift.
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Install prepare test dependencies
        run: |
          python -m pip install -r requirements-prepare.txt
          python -c "import numpy, tokenizers"

      - name: Test
        run: CGO_ENABLED=0 go test ./... -count=1 -timeout 600s

      # scripts/ ships in the RunPod image; its tests otherwise only ran by hand.
      - name: Test Python scripts
        run: python -m unittest discover -s scripts -p '*_test.py'

      # The Docker Hub overview is published from docker/DOCKERHUB.md by Cloud
      # Build. Validate it here so a blank or oversized file fails on the PR
      # rather than silently blanking the image's landing page on merge.
      - name: Test Docker Hub description sync
        run: python3 docker/test_sync_dockerhub_description.py

      - name: Validate Docker Hub descriptions
        run: |
          python3 docker/sync_dockerhub_description.py --dry-run \
            --target=mixlab=docker/DOCKERHUB.md \
            --target=mixlab-cuda=docker/DOCKERHUB-cuda.md \
            --target=mixlab-cuda-base=docker/DOCKERHUB-cuda-base.md

      # Exercise the pinned dependency's real completion loop without a GPU.
      # MLX v0.32.4 fixed the idle spin upstream; this keeps it from returning.
      - name: Test MLX CUDA worker
        run: |
          ROOT="$RUNNER_TEMP/mlx-worker"
          SOURCE="$ROOT/mlx/backend/cuda/worker.cpp"
          mkdir -p "$(dirname "$SOURCE")"
          curl --fail --location --max-time 30 \
            https://raw.githubusercontent.com/ml-explore/mlx/36969c094354086e15d2a327a9c50feb20b9cf11/mlx/backend/cuda/worker.cpp \
            -o "$SOURCE"
          python3 docker/test_mlx_worker.py --source "$SOURCE"

      - name: Test MLX convolution weight tiles
        run: |
          ROOT="$RUNNER_TEMP/mlx-conv-tiles"
          SOURCE="$ROOT/mlx/primitives.cpp"
          mkdir -p "$(dirname "$SOURCE")"
          curl --fail --location --max-time 30 \
            https://raw.githubusercontent.com/ml-explore/mlx/36969c094354086e15d2a327a9c50feb20b9cf11/mlx/primitives.cpp \
            -o "$SOURCE"
          git -C "$ROOT" apply "$GITHUB_WORKSPACE/docker/patches/mlx-conv-transpose-weight-grad.patch"
          python3 docker/test_mlx_conv_weight_tiles.py --source "$SOURCE" --expect-broken
          git -C "$ROOT" apply --check "$GITHUB_WORKSPACE/docker/patches/mlx-conv-weight-tiles.patch"
          git -C "$ROOT" apply "$GITHUB_WORKSPACE/docker/patches/mlx-conv-weight-tiles.patch"
          python3 docker/test_mlx_conv_weight_tiles.py --source "$SOURCE"

      - name: Test MLX CUDA allocator patch
        run: |
          ROOT="$RUNNER_TEMP/mlx-allocator"
          SOURCE="$ROOT/mlx/backend/cuda/allocator.cpp"
          mkdir -p "$(dirname "$SOURCE")"
          mkdir -p "$(dirname "$SOURCE")/conv"
          for FILE in allocator.cpp allocator.h eval.cpp cudnn_utils.cpp conv/gemm_conv.cu conv/gemm_grouped_conv.cu; do
            curl --fail --location --max-time 30 \
              "https://raw.githubusercontent.com/ml-explore/mlx/36969c094354086e15d2a327a9c50feb20b9cf11/mlx/backend/cuda/$FILE" \
              -o "$(dirname "$SOURCE")/$FILE"
          done
          python3 docker/test_mlx_allocator.py --source "$SOURCE" --expect-broken
          git -C "$ROOT" apply --check "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-allocator-reclaim.patch"
          git -C "$ROOT" apply "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-allocator-reclaim.patch"
          python3 docker/test_mlx_allocator.py --source "$SOURCE"
          python3 docker/test_mlx_allocator_retry.py --source "$SOURCE"

      - name: Test MLX strict convolution fallback patch
        run: |
          ROOT="$RUNNER_TEMP/mlx-conv"
          SOURCE="$ROOT/mlx/backend/cuda/conv.cpp"
          mkdir -p "$(dirname "$SOURCE")"
          curl --fail --location --max-time 30 \
            "https://raw.githubusercontent.com/ml-explore/mlx/36969c094354086e15d2a327a9c50feb20b9cf11/mlx/backend/cuda/conv.cpp" -o "$SOURCE"
          python3 docker/test_mlx_conv_fallback.py --source "$SOURCE" --expect-broken
          git -C "$ROOT" apply --check "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-conv-plan-fallback.patch"
          git -C "$ROOT" apply "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-conv-plan-fallback.patch"
          python3 docker/test_mlx_conv_fallback.py --source "$SOURCE"

      - name: Test MLX JIT CCCL install-dir patch
        run: |
          ROOT="$RUNNER_TEMP/mlx-jit-cccl"
          mkdir -p "$ROOT/mlx/backend/cuda"
          for FILE in CMakeLists.txt dirs.cpp; do
            curl --fail --location --max-time 30 \
              "https://raw.githubusercontent.com/ml-explore/mlx/36969c094354086e15d2a327a9c50feb20b9cf11/mlx/backend/cuda/$FILE" \
              -o "$ROOT/mlx/backend/cuda/$FILE"
          done
          python3 docker/test_mlx_jit_cccl.py --source "$ROOT" --expect-broken
          git -C "$ROOT" apply --check "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-jit-cccl-install-dir.patch"
          git -C "$ROOT" apply "$GITHUB_WORKSPACE/docker/patches/mlx-cuda-jit-cccl-install-dir.patch"
          python3 docker/test_mlx_jit_cccl.py --source "$ROOT"

  image-python:
    name: Image Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The images install these with the base image's system Python (Ubuntu
      # 22.04's 3.10), not the 3.12 the tests use. TestImageDependenciesAre-
      # ResolvedOnTheImagePython keeps this version tied to the base image.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Resolve the image dependency set
        run: |
          python -m pip install --quiet --upgrade 'pip>=26.2'
          python -m pip install --dry-run --quiet \
            -c requirements-prepare.txt -r requirements-prepare.txt -r requirements-runpod.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          CGO_ENABLED: "0"
        with:
          version: v2.14.0
          args: ./...

      - name: Check file sizes (max 1000 lines per .go file)
        run: |
          find . -name "*.go" -not -path "./vendor/*" -exec wc -l {} + | sort -rn | \
            awk '$1 > 1000 && $2 != "total" {printf "OVER 1000 LINES: %s (%d)\n", $2, $1; err=1} END {exit err}'
