# CI pipeline: build CLI + RunPod images, push to registry.
# Triggered on push to main.
#
# Required substitutions (set in the Cloud Build trigger):
#   _REGISTRY_PREFIX  — e.g. us-central1-docker.pkg.dev/my-project/my-repo
#   _MLX_BASE_IMAGE   — e.g. us-central1-docker.pkg.dev/my-project/my-repo/mlx-cuda:latest
#
# Optional substitutions:
#   _IMAGE_TAG        — CLI image tag, defaults to latest
#   _RUNPOD_TAG       — RunPod image tag, defaults to runpod
#   _RELEASE_VERSION  — OCI version label, defaults to trigger tag or dev
#   _SOURCE_REVISION  — OCI revision label, defaults to trigger commit or unknown
# Docker Hub push requires a secret named "dockerhub-token" and a non-empty
# _DOCKERHUB_USER substitution. The same credentials publish
# docker/DOCKERHUB.md as the repository overview.

substitutions:
  _REGISTRY_PREFIX: ''
  _MLX_BASE_IMAGE: ''
  _DOCKERHUB_USER: ''
  _IMAGE_TAG: 'latest'
  _RUNPOD_TAG: 'runpod'
  _RELEASE_VERSION: '${TAG_NAME:-dev}'
  _SOURCE_REVISION: '${COMMIT_SHA:-unknown}'

steps:
  # Build CLI image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/app.Dockerfile'
      - '--build-arg'
      - 'BASE_IMAGE=${_MLX_BASE_IMAGE}'
      - '--build-arg'
      - 'MIXLAB_VERSION=${_RELEASE_VERSION}'
      - '--build-arg'
      - 'VCS_REF=${_SOURCE_REVISION}'
      - '-t'
      - '${_REGISTRY_PREFIX}/mixlab:${_IMAGE_TAG}'
      - '.'

  # Build RunPod image on top of CLI
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/runpod.Dockerfile'
      - '--build-arg'
      - 'APP_IMAGE=${_REGISTRY_PREFIX}/mixlab:${_IMAGE_TAG}'
      - '-t'
      - '${_REGISTRY_PREFIX}/mixlab:${_RUNPOD_TAG}'
      - '.'

  # Push to Docker Hub (optional — only runs if _DOCKERHUB_USER is set)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -z "${_DOCKERHUB_USER}" ]; then
          echo "Skipping Docker Hub push (_DOCKERHUB_USER not set)"
          exit 0
        fi
        echo "$$DOCKER_TOKEN" | docker login -u ${_DOCKERHUB_USER} --password-stdin
        docker tag ${_REGISTRY_PREFIX}/mixlab:${_IMAGE_TAG} ${_DOCKERHUB_USER}/mixlab:${_IMAGE_TAG}
        docker tag ${_REGISTRY_PREFIX}/mixlab:${_RUNPOD_TAG} ${_DOCKERHUB_USER}/mixlab:${_RUNPOD_TAG}
        docker push ${_DOCKERHUB_USER}/mixlab:${_IMAGE_TAG}
        docker push ${_DOCKERHUB_USER}/mixlab:${_RUNPOD_TAG}
    secretEnv: ['DOCKER_TOKEN']

  # Sync the Docker Hub overview from docker/DOCKERHUB.md.
  # Runs after the push so the landing page can never describe a version of the
  # software older than the image sitting next to it. Aborts the build on a
  # missing or empty file rather than blanking a working overview.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'python3'
    args:
      - 'docker/sync_dockerhub_description.py'
      - '--user=${_DOCKERHUB_USER}'
      - '--repo=mixlab'
      - '--file=docker/DOCKERHUB.md'
      # Cloud Build rejects binding one secret version to two env names, so
      # reuse the DOCKER_TOKEN binding the push step above already declares.
      - '--token-env=DOCKER_TOKEN'
    secretEnv: ['DOCKER_TOKEN']

images:
  - '${_REGISTRY_PREFIX}/mixlab:${_IMAGE_TAG}'
  - '${_REGISTRY_PREFIX}/mixlab:${_RUNPOD_TAG}'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/dockerhub-token/versions/latest
      env: 'DOCKER_TOKEN'

options:
  dynamicSubstitutions: true
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
