# Rebuild the CUDA base from the pinned MLX source release.
#
# Run this before cloudbuild-golf-mlx-cuda.yaml whenever MLX changes. The
# add-architecture build deliberately refuses a base with a different MLX
# version or commit.
#
# Usage:
#   gcloud builds submit \
#     --config=docker/cloudbuild-mlx-cuda-base.yaml \
#     --substitutions=_REGISTRY_PREFIX=us-central1-docker.pkg.dev/my-project/my-repo \
#     --timeout=14400s \
#     .

substitutions:
  _REGISTRY_PREFIX: ""
  _MLX_VERSION: "v0.32.0"
  _MLX_COMMIT: "7a1d4f5c12ac82f4b4d0a6e71538d89ca0605247"

steps:
  # The registry has no default: this repository is public, so the project
  # lives in the trigger or the submit command. Fail before a four-hour build.
  - name: 'bash'
    args:
      - '-c'
      - |
        for pair in "_REGISTRY_PREFIX=${_REGISTRY_PREFIX}"; do
          [ -n "$${pair#*=}" ] || { echo "substitution $${pair%%=*} is required"; exit 1; }
        done

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/base.Dockerfile'
      - '--build-arg'
      - 'MLX_VERSION=${_MLX_VERSION}'
      - '--build-arg'
      - 'MLX_COMMIT=${_MLX_COMMIT}'
      - '-t'
      - '${_REGISTRY_PREFIX}/golf-mlx-cuda-base:mlx-0.32.0-go1.27.1'
      - '.'

images:
  - '${_REGISTRY_PREFIX}/golf-mlx-cuda-base:mlx-0.32.0-go1.27.1'

options:
  machineType: 'E2_HIGHCPU_32'
  diskSizeGb: 100

timeout: 14400s
