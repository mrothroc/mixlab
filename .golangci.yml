version: "2"

linters:
  enable:
    - errcheck        # unchecked errors
    - govet           # go vet
    - ineffassign     # useless assignments
    - staticcheck     # comprehensive static analysis (includes gosimple)
    - unused          # unused code
    - gocritic        # opinionated style checks
    - misspell        # spelling in comments/strings
    - unconvert       # unnecessary type conversions
    - unparam         # unused function parameters

  settings:
    gocritic:
      disabled-checks:
        - captLocal         # B, T, D, H are standard ML notation
        - exitAfterDefer    # pprof defer is intentional

  exclusions:
    rules:
      - path: "arch/"
        linters: [unparam]
        text: "always receives"   # B, x, stream are fixed at IR build time by design
      # The GPU trainer constructors return an error unconditionally in the
      # no-MLX stub build, so staticcheck proves every `if err != nil` guarding
      # them is always taken. The guards are required in the -tags mlx build,
      # where the same constructors succeed.
      - path: "train/"
        linters: [staticcheck]
        text: "SA4023"
    paths:
      - vendor
